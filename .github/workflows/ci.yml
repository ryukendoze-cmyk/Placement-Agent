name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -m "not integration" -q

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ps06_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ps06_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Enable pgvector extension
        run: >-
          uv run python -c "import psycopg;
          conn = psycopg.connect('postgresql://postgres@127.0.0.1:5432/ps06_test', autocommit=True);
          conn.execute('CREATE EXTENSION IF NOT EXISTS vector;');
          conn.close();
          print('pgvector extension enabled in ps06_test')"
      - name: Integration tests
        run: uv run pytest -m integration -q
