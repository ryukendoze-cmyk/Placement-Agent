apply plugin: 'com.android.application'

android {
    namespace "in.edu.jklu.careeros"
    compileSdk 34

    defaultConfig {
        applicationId "in.edu.jklu.careeros"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "3.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation project(':capacitor-android')
}
