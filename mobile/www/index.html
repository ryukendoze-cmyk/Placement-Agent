<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JKLU CareerOS — Server Connection</title>
  <style>
    :root {
      --bg: #F4F3EC;
      --green: #1D5C42;
      --green-dark: #154531;
      --ink: #1B2420;
      --muted: #5B6660;
      --border: #D8D6CB;
      --ok-bg: #E6F4EC;
      --ok-ink: #145339;
      --err-bg: #FDECEC;
      --err-ink: #8B1E1E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 28px rgba(27, 36, 32, 0.08);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--green);
      color: var(--bg);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
    }
    h1 {
      margin: 0;
      font-size: 19px;
      color: var(--green);
    }
    .subtitle {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="url"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: #FAFAF7;
      color: var(--ink);
    }
    input[type="url"]:focus {
      outline: 2px solid var(--green);
      border-color: var(--green);
    }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }
    .preset-btn {
      background: var(--bg);
      color: var(--green);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: #E9E7DC;
      color: var(--ink);
    }
    .btn-primary {
      background: var(--green);
      color: #FFFFFF;
    }
    .btn-primary:active {
      background: var(--green-dark);
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .status.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-ink);
    }
    .status.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-ink);
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="logo">J</div>
      <div>
        <h1>JKLU CareerOS — Server Connection</h1>
        <p class="subtitle">Connect to your local or campus LAN CareerOS server</p>
      </div>
    </div>

    <label for="server-url">CareerOS Server URL</label>
    <input
      id="server-url"
      type="url"
      inputmode="url"
      autocomplete="url"
      placeholder="http://192.168.1.100:8010"
      value="http://127.0.0.1:8010"
    />

    <div class="presets">
      <button type="button" class="preset-btn" data-url="http://10.0.2.2:8010">
        Android Emulator (10.0.2.2:8010)
      </button>
      <button type="button" class="preset-btn" data-url="http://127.0.0.1:8010">
        ADB Reverse (127.0.0.1:8010)
      </button>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-secondary" id="test-btn">Test Connection</button>
      <button type="button" class="btn btn-primary" id="launch-btn">Launch CareerOS</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <p class="hint">
      USB Demo: run <code>adb reverse tcp:8010 tcp:8010</code> and use <code>http://127.0.0.1:8010</code>.
      Wi-Fi / Hotspot: run <code>scripts/serve_lan.ps1</code> on the host PC and enter its LAN IP.
    </p>
  </main>

  <script>
    const STORAGE_KEY = "careeros_server_url";
    const input = document.getElementById("server-url");
    const statusEl = document.getElementById("status");
    const testBtn = document.getElementById("test-btn");
    const launchBtn = document.getElementById("launch-btn");

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      input.value = saved;
    }

    function normalizeUrl(raw) {
      return String(raw || "").trim().replace(/\/+$/, "");
    }

    function showStatus(msg, ok) {
      statusEl.textContent = msg;
      statusEl.className = "status " + (ok ? "ok" : "err");
    }

    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        input.value = btn.getAttribute("data-url") || "";
        localStorage.setItem(STORAGE_KEY, normalizeUrl(input.value));
        statusEl.className = "status";
      });
    });

    testBtn.addEventListener("click", async () => {
      const url = normalizeUrl(input.value);
      if (!url) {
        showStatus("Please enter a valid server URL.", false);
        return;
      }
      localStorage.setItem(STORAGE_KEY, url);
      showStatus("Testing " + url + "/healthz ...", true);
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 5000);
      try {
        const res = await fetch(url + "/healthz", { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) {
          showStatus("Server responded with HTTP " + res.status, false);
          return;
        }
        const data = await res.json().catch(() => ({}));
        showStatus("Connected (" + (data.status || "healthy") + "). Ready to launch.", true);
      } catch (err) {
        clearTimeout(timer);
        showStatus("Connection failed: " + (err && err.message ? err.message : "unreachable"), false);
      }
    });

    launchBtn.addEventListener("click", () => {
      const url = normalizeUrl(input.value);
      if (!url) {
        showStatus("Please enter a valid server URL.", false);
        return;
      }
      localStorage.setItem(STORAGE_KEY, url);
      window.location.href = url;
    });
  </script>
</body>
</html>
