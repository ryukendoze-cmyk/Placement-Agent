services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ps06
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ps06"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/ps06
      REDIS_URL: redis://redis:6379/0
      TASK_BACKEND: redis
      EMBEDDER: hashing
      LLM_PROVIDER: mock
      AUTH_MODE: ${AUTH_MODE:-demo}
      DEMO_ROLE_SWITCH: ${DEMO_ROLE_SWITCH:-true}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-ps06-jklu-careeros-dev-secret-key-change-in-prod-2026}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    command: sh -c "python -m app.cli seed --demo-cohort && uvicorn app.api.__main__:app --host 0.0.0.0 --port 8010"

volumes:
  pgdata:
